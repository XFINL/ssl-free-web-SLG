<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="专业的SSL证书申请平台，提供泛域名和单域名SSL证书申请服务">
  <title>SecureSSL - 专业SSL证书申请平台</title>
  
  <link rel="stylesheet" href="css/index.css">
</head>
<body>
  <div class="container">
    
    <header class="header">
      <div class="logo">
        <span class="logo-text">SecureSSL</span>
      </div>
    </header>

    <main class="main-content">
      
      <section class="search-section">
        <div class="search-box glass">
          <input 
            type="text" 
            class="search-input" 
            id="domainInput"
            placeholder="输入您的域名..."
            aria-label="域名搜索"
          >
          <button class="search-btn" id="searchBtn">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <path d="m21 21-4.35-4.35"></path>
            </svg>
          </button>
        </div>
      </section>

      <section class="pricing-section">
        
        <article class="price-card glass liquid-shine">
          <div class="card-badge">Wildcard</div>
          <h3 class="card-title">泛域名SSL证书</h3>
          <p class="card-description">保护主域名及所有子域名，无限子域</p>
          <div class="card-price">
            <span class="price-symbol">¥</span>
            <span class="price-value">15</span>
            <span class="price-unit">/张</span>
          </div>
        </article>

        <article class="price-card glass liquid-shine">
          <div class="card-badge">Single</div>
          <h3 class="card-title">单域名SSL证书</h3>
          <p class="card-description">保护单个域名，简单快捷</p>
          <div class="card-price">
            <span class="price-symbol">¥</span>
            <span class="price-value">5</span>
            <span class="price-unit">/张</span>
          </div>
        </article>

      </section>
    </main>

    <div class="bg-decoration">
      <div class="glow glow-1"></div>
      <div class="glow glow-2"></div>
      <div class="glow glow-3"></div>
    </div>

  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
