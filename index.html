<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="专业的SSL证书申请平台，提供泛域名和单域名SSL证书申请服务">
  <title>SecureSSL - 专业SSL证书申请平台</title>
  
  <link rel="stylesheet" href="https://at.alicdn.com/t/font_3503739_1gty9b4e65d.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="container">
    
    <header class="header">
      <div class="logo">
        <span class="logo-icon">
          <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M20 4L6 12V22C6 30.84 12.28 39.18 20 40C27.72 39.18 34 30.84 34 22V12L20 4Z" fill="none" stroke="white" stroke-width="2"/>
            <path d="M14 20L18 24L26 16" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span class="logo-text">SecureSSL</span>
      </div>
    </header>

    <main class="main-content">
      
      <section class="search-section">
        <div class="search-box glass">
          <input 
            type="text" 
            class="search-input" 
            placeholder="输入您的域名..."
            aria-label="域名搜索"
          >
          <span class="search-icon iconfont icon-sousuo"></span>
        </div>
      </section>

      <section class="pricing-section">
        
        <article class="price-card glass liquid-shine" data-type="wildcard">
          <div class="card-badge">Wildcard</div>
          <h3 class="card-title">泛域名SSL证书</h3>
          <p class="card-description">保护主域名及所有子域名，无限子域</p>
          <div class="card-price">
            <span class="price-symbol">¥</span>
            <span class="price-value">15</span>
            <span class="price-unit">/张</span>
          </div>
          <button class="card-button">立即申请</button>
        </article>

        <article class="price-card glass liquid-shine" data-type="single">
          <div class="card-badge">Single</div>
          <h3 class="card-title">单域名SSL证书</h3>
          <p class="card-description">保护单个域名，简单快捷</p>
          <div class="card-price">
            <span class="price-symbol">¥</span>
            <span class="price-value">5</span>
            <span class="price-unit">/张</span>
          </div>
          <button class="card-button">立即申请</button>
        </article>

      </section>
    </main>

    <div class="bg-decoration">
      <div class="glow glow-1"></div>
      <div class="glow glow-2"></div>
      <div class="glow glow-3"></div>
    </div>

  </div>

  <script src="js/main.js"></script>
</body>
</html>
