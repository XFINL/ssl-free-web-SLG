<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="SSL证书申请页面 - 配置证书参数">
  <title>SSL证书申请 - SecureSSL</title>
  
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="apply-container">
    
    <header class="apply-header">
      <div class="header-content">
        <div class="logo" onclick="goBack()">
          <span class="logo-text">SecureSSL</span>
        </div>
        <button class="back-btn" onclick="goBack()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M15 19l-7-7 7-7"/>
          </svg>
          返回首页
        </button>
      </div>
    </header>

    <main class="apply-main">
      
      <div class="apply-step">
        <div class="step-indicator">
          <div class="step active" data-step="1">1</div>
          <div class="step-line"></div>
          <div class="step" data-step="2">2</div>
          <div class="step-line"></div>
          <div class="step" data-step="3">3</div>
        </div>
        <div class="step-labels">
          <span>配置</span>
          <span>验证</span>
          <span>完成</span>
        </div>
      </div>

      <section class="apply-section" id="domainSection">
        <h2 class="section-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          </svg>
          域名信息
        </h2>
        <div class="glass card">
          <label class="form-label">域名</label>
          <input 
            type="text" 
            class="form-input" 
            id="domain" 
            placeholder="请输入域名"
          >
          <label class="form-label">证书类型</label>
          <div class="radio-group">
            <label class="radio-option">
              <input type="radio" name="certType" value="single" checked>
              <span class="radio-custom"></span>
              单域名证书
            </label>
            <label class="radio-option">
              <input type="radio" name="certType" value="wildcard">
              <span class="radio-custom"></span>
              泛域名证书
            </label>
          </div>
        </div>
      </section>

      <section class="apply-section" id="caSection">
        <h2 class="section-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
          颁发机构
        </h2>
        <div class="glass card">
          <label class="form-label">选择CA</label>
          <div class="ca-options">
            <label class="ca-option">
              <input type="radio" name="ca" value="google" checked>
              <div class="ca-card">
                <div class="ca-icon google">
                  <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                  </svg>
                </div>
                <span class="ca-name">Google Trust Services</span>
                <span class="ca-desc">免费SSL证书，90天有效期</span>
              </div>
            </label>
            <label class="ca-option">
              <input type="radio" name="ca" value="zerossl">
              <div class="ca-card">
                <div class="ca-icon zerossl">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/>
                    <path d="M8 15s1.5-2 4-2 4 2 4 2"/>
                    <path d="M9 9h.01"/>
                    <path d="M15 9h.01"/>
                  </svg>
                </div>
                <span class="ca-name">ZeroSSL</span>
                <span class="ca-desc">免费SSL证书，90天有效期</span>
              </div>
            </label>
          </div>
        </div>
      </section>

      <section class="apply-section" id="durationSection">
        <h2 class="section-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <polyline points="12 6 12 12 16 14"/>
          </svg>
          有效期
        </h2>
        <div class="glass card">
          <label class="form-label">选择有效期</label>
          <div class="duration-options">
            <label class="duration-option">
              <input type="radio" name="duration" value="90" checked>
              <span class="duration-value">90</span>
              <span class="duration-unit">天</span>
            </label>
            <label class="duration-option">
              <input type="radio" name="duration" value="180">
              <span class="duration-value">180</span>
              <span class="duration-unit">天</span>
            </label>
            <label class="duration-option">
              <input type="radio" name="duration" value="365">
              <span class="duration-value">365</span>
              <span class="duration-unit">天</span>
            </label>
          </div>
        </div>
      </section>

      <section class="apply-section" id="csrSection">
        <h2 class="section-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="16" y1="13" x2="8" y2="13"/>
            <line x1="16" y1="17" x2="8" y2="17"/>
            <polyline points="10 9 9 9 8 9"/>
          </svg>
          CSR配置
        </h2>
        <div class="glass card">
          <div class="radio-group csr-radio">
            <label class="radio-option">
              <input type="radio" name="csrType" value="auto" checked>
              <span class="radio-custom"></span>
              自动生成CSR
            </label>
            <label class="radio-option">
              <input type="radio" name="csrType" value="manual">
              <span class="radio-custom"></span>
              手动输入CSR
            </label>
          </div>
          
          <div class="csr-fields" id="autoCsrFields">
            <div class="csr-row">
              <div class="csr-field">
                <label class="form-label">国家 (C)</label>
                <input type="text" class="form-input" id="country" placeholder="CN" value="CN">
              </div>
              <div class="csr-field">
                <label class="form-label">省份 (ST)</label>
                <input type="text" class="form-input" id="state" placeholder="Beijing">
              </div>
            </div>
            <div class="csr-row">
              <div class="csr-field">
                <label class="form-label">城市 (L)</label>
                <input type="text" class="form-input" id="city" placeholder="Beijing">
              </div>
              <div class="csr-field">
                <label class="form-label">组织 (O)</label>
                <input type="text" class="form-input" id="organization" placeholder="SecureSSL">
              </div>
            </div>
            <div class="csr-row">
              <div class="csr-field">
                <label class="form-label">组织单位 (OU)</label>
                <input type="text" class="form-input" id="orgUnit" placeholder="IT Department">
              </div>
              <div class="csr-field">
                <label class="form-label">邮箱</label>
                <input type="email" class="form-input" id="email" placeholder="admin@example.com">
              </div>
            </div>
          </div>

          <div class="csr-fields hidden" id="manualCsrFields">
            <label class="form-label">CSR内容</label>
            <textarea 
              class="form-textarea" 
              id="csrContent" 
              placeholder="请粘贴您的CSR内容...&#10;&#10;-----BEGIN CERTIFICATE REQUEST-----&#10;...&#10;-----END CERTIFICATE REQUEST-----"
            ></textarea>
          </div>
        </div>
      </section>

      <section class="apply-section" id="advancedSection">
        <h2 class="section-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
          高级选项
        </h2>
        <div class="glass card">
          <label class="checkbox-option">
            <input type="checkbox" id="ecc" checked>
            <span class="checkbox-custom"></span>
            使用 ECC 算法 (ECDSA)
          </label>
          <label class="checkbox-option">
            <input type="checkbox" id="wildcard">
            <span class="checkbox-custom"></span>
            包含 www 子域名
          </label>
          <label class="checkbox-option">
            <input type="checkbox" id="autoRenew">
            <span class="checkbox-custom"></span>
            启用自动续期
          </label>
          <label class="checkbox-option">
            <input type="checkbox" id="ocsp">
            <span class="checkbox-custom"></span>
            启用 OCSP Stapling
          </label>
        </div>
      </section>

      <section class="apply-summary">
        <h2 class="section-title">订单摘要</h2>
        <div class="glass card summary-card">
          <div class="summary-row">
            <span class="summary-label">域名</span>
            <span class="summary-value" id="summaryDomain">-</span>
          </div>
          <div class="summary-row">
            <span class="summary-label">证书类型</span>
            <span class="summary-value" id="summaryType">单域名证书</span>
          </div>
          <div class="summary-row">
            <span class="summary-label">颁发机构</span>
            <span class="summary-value" id="summaryCA">Google Trust Services</span>
          </div>
          <div class="summary-row">
            <span class="summary-label">有效期</span>
            <span class="summary-value" id="summaryDuration">90天</span>
          </div>
          <div class="summary-row">
            <span class="summary-label">CSR方式</span>
            <span class="summary-value" id="summaryCSR">自动生成</span>
          </div>
          <div class="summary-row total">
            <span class="summary-label">总计</span>
            <span class="summary-value price">¥<span id="summaryPrice">0</span></span>
          </div>
        </div>

        <button class="submit-btn" id="submitBtn">提交申请</button>
      </section>
    </main>

    <div class="bg-decoration">
      <div class="glow glow-1"></div>
      <div class="glow glow-2"></div>
      <div class="glow glow-3"></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="js/apply.js"></script>
</body>
</html>
